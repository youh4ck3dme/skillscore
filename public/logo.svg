<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 52" fill="none" role="img" aria-label="SkillScore logo">
  <defs>
    <!-- Gradient for icon background -->
    <linearGradient id="iconGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <!-- Subtle glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Icon container: rounded square with gradient -->
  <rect x="1" y="1" width="46" height="46" rx="12" fill="url(#iconGrad)"/>
  <!-- Subtle inner border -->
  <rect x="1" y="1" width="46" height="46" rx="12" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>

  <!-- Bar chart bars (white, rounded caps) -->
  <!-- Bar 1 — short -->
  <rect x="8" y="30" width="7" height="12" rx="2.5" fill="white" opacity="0.7"/>
  <!-- Bar 2 — medium -->
  <rect x="19" y="22" width="7" height="20" rx="2.5" fill="white" opacity="0.85"/>
  <!-- Bar 3 — tall -->
  <rect x="30" y="14" width="7" height="28" rx="2.5" fill="white"/>

  <!-- Checkmark above bar 3 -->
  <polyline
    points="27,11 31,15.5 39,6"
    stroke="white"
    stroke-width="2.8"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Wordmark -->
  <text
    x="57"
    y="35"
    font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif"
    font-size="24"
    font-weight="800"
    letter-spacing="-0.8"
  >
    <tspan fill="#0f172a">Skill</tspan><tspan fill="#0ea5e9">Score</tspan>
  </text>

  <!-- Tagline -->
  <text
    x="58"
    y="46"
    font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif"
    font-size="8"
    font-weight="500"
    letter-spacing="1.5"
    fill="#94a3b8"
    text-transform="uppercase"
  >SKILL VERIFICATION PLATFORM</text>
</svg>
